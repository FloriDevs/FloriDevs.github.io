<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blocked — FloriDevs</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
    --bg:#0b0f14;
    --panel:#121821cc;
    --accent:#4cc9f0;
    --danger:#ff4d6d;
    --text:#e6edf3;
    --muted:#8b949e;
}

*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;}

body{
    background:radial-gradient(circle at top,#111926,#05080c);
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.card{
    background:var(--panel);
    backdrop-filter:blur(18px);
    border:1px solid #1f2a37;
    border-radius:22px;
    padding:40px 50px;
    max-width:560px;
    width:90%;
    box-shadow:0 0 60px #000;
    text-align:center;
    animation:fade 0.6s ease;
}

@keyframes fade{
    from{opacity:0;transform:translateY(20px)}
    to{opacity:1;transform:translateY(0)}
}

.icon{
    font-size:52px;
    margin-bottom:15px;
    color:var(--danger);
}

h1{
    font-size:26px;
    margin-bottom:10px;
}

.subtitle{
    color:var(--muted);
    margin-bottom:25px;
}

.reason-box{
    text-align:left;
    background:#0c1219;
    border-radius:14px;
    padding:20px 25px;
    border:1px solid #1b2430;
}

.reason{
    display:flex;
    align-items:center;
    margin:12px 0;
    font-size:15px;
}

.dot{
    width:9px;
    height:9px;
    border-radius:50%;
    margin-right:12px;
    background:var(--accent);
    box-shadow:0 0 10px var(--accent);
}

.footer{
    margin-top:30px;
    font-size:12px;
    color:var(--muted);
}

.brand{
    margin-top:18px;
    font-size:13px;
    color:var(--accent);
    letter-spacing:.5px;
}
</style>
</head>

<body>
<div class="card">

<div class="icon">⛔</div>

<h1>Domain Blocked</h1>
<div class="subtitle">
FloriDevs Data-Safa-Netblocker blocked this domain.
</div>

<div class="reason-box">

<div class="reason"><div class="dot"></div>Likely malware</div>
<div class="reason"><div class="dot"></div>Is an ad service</div>
<div class="reason"><div class="dot"></div>Tracks users</div>

</div>

<div class="brand">Protected by FloriDevs Security Engine</div>

<div class="footer">
Request ID: <span id="id"></span>
</div>

</div>

<script>
document.getElementById("id").textContent =
Math.random().toString(36).substring(2,12).toUpperCase();
</script>

</body>
</html>
