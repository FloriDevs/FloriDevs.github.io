<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us - FloriDevs</title>
    <style>
        body {
            background-image: url(index.png);
            background-size: cover; /* Make image cover the whole page */
            background-repeat: no-repeat; /* Prevent image from repeating */
            background-attachment: fixed; /* Keep image fixed while scrolling */
            color: aqua;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* A modern font */
            text-align: center; /* Center the text */
            margin: 0;
            padding: 0;
            min-height: 100vh; /* Make body fill the whole viewport height */
            display: flex; /* Use flexbox for vertical centering */
            flex-direction: column; /* Stack elements vertically */
            justify-content: center; /* Center content vertically */
        }
        h1 {
            font-size: 3em; /* Larger title */
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5); /* Add a shadow to the title */
        }
        h2 {
            font-size: 2em;
            margin-bottom: 10px;
            color: #00ffff; /* A brighter aqua */
        }
        h3 {
            font-size: 1.2em;
            margin-bottom: 10px;
            color: #80ffff; /* A lighter aqua */
        }
        b, u, i { /* Style bold, underline, italic tags */
            color: #00ffff; /* Make them stand out */
        }
    </style>
</head>
<body>
    <h1><b><u><i>Flori Devs</i></u></b></h1>
    <h2>Flori</h2>
    <h3>I am a developer.</h3>

    <h3>I work a lot for my FloriDevs :-D</h3>
</body>
</html>
