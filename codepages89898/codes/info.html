!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Systeminfo - Cyberstyle</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 50px;
        }

        h1 {
            font-size: 2.5em;
            text-shadow: 0 0 10px #00ffcc;
        }

        #info {
            background-color: #333;
            border: 1px solid #00ffcc;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 0 20px #00ffcc;
        }

        @keyframes glow {
            0% { text-shadow: 0 0 5px #00ffcc, 0 0 10px #00ffcc; }
            50% { text-shadow: 0 0 20px #00ffcc, 0 0 30px #00ffcc; }
            100% { text-shadow: 0 0 5px #00ffcc, 0 0 10px #00ffcc; }
        }

        h1 {
            animation: glow 1.5s infinite alternate;
        }
    </style>
</head>
<body>
    <h1>Systeminformationen</h1>
    <div id="info"></div>

    <script>
        function getOS() {
            const userAgent = window.navigator.userAgent;
            let os = "Unbekannt";
            if (userAgent.includes("Win")) os = "Windows";
            else if (userAgent.includes("Mac")) os = "MacOS";
            else if (userAgent.includes("Linux")) os = "Linux";
            else if (userAgent.includes("Android")) os = "Android";
            else if (userAgent.includes("iPhone") || userAgent.includes("iPad")) os = "iOS";
            return os;
        }

        async function getPublicIP() {
            const response = await fetch('https://api.ipify.org?format=json');
            const data = await response.json();
            return data.ip;
        }

        async function displayInfo() {
            const os = getOS();
            const ip = await getPublicIP();
            const cookies = document.cookie;

            document.getElementById('info').innerHTML = `
                <strong>Betriebssystem:</strong> ${os}<br>
                <strong>Öffentliche IP:</strong> ${ip}<br>
                <strong>Cookies:</strong> ${cookies}
            `;
        }

        displayInfo();
    </script>
</body>
</html>
