<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captcha Demo</title>
    <style>
        body {
            font-family: sans-serif;
        }
        .popup-container {
            display: none; /* Anfangs versteckt */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); /* Transparenter Hintergrund */
            justify-content: center;
            align-items: center;
        }
        .popup {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        .captcha-question {
            font-size: 1.2em;
            margin-bottom: 10px;
        }
        .captcha-input {
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .captcha-buttons button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            font-weight: bold;
        }
        .captcha-buttons .submit {
            background-color: #007bff;
            color: white;
        }
        .captcha-buttons .dino {
            background-color: #28a745;
            color: white;
        }
    </style>
</head>
<body>

    <h1>Willkommen!</h1>
    <p>Diese Seite ist durch ein einfaches Captcha geschützt.</p>
    <button id="showPopupBtn">Captcha anzeigen</button>

    <div id="popupContainer" class="popup-container">
        <div class="popup">
            <div class="captcha-question" id="captchaQuestion"></div>
            <input type="text" id="captchaAnswer" class="captcha-input" placeholder="Antwort">
            <div class="captcha-buttons">
                <button class="submit" onclick="checkCaptcha()">Überprüfen</button>
                <button class="dino" onclick="goToPage()">Ich bin ein Dino!</button>
            </div>
        </div>
    </div>

    <script>
        const popupContainer = document.getElementById('popupContainer');
        const showPopupBtn = document.getElementById('showPopupBtn');
        const captchaQuestion = document.getElementById('captchaQuestion');
        const captchaAnswer = document.getElementById('captchaAnswer');

        let num1, num2, correctAnswer;

        function generateCaptcha() {
            num1 = Math.floor(Math.random() * 10) + 1;
            num2 = Math.floor(Math.random() * 10) + 1;
            correctAnswer = num1 + num2;
            captchaQuestion.textContent = `Was ist ${num1} + ${num2}?`;
        }

        function showPopup() {
            generateCaptcha();
            popupContainer.style.display = 'flex';
        }

        function checkCaptcha() {
            const userAnswer = parseInt(captchaAnswer.value);
            if (!isNaN(userAnswer) && userAnswer === correctAnswer) {
                goToPage();
            } else {
                alert('Captcha falsch! Bitte versuche es erneut oder klicke "Ich bin ein Dino!".');
                generateCaptcha(); // Neues Captcha bei falscher Antwort
                captchaAnswer.value = ''; // Eingabefeld leeren
            }
        }

        function goToPage() {
            window.location.href = 'page.html';
        }

        showPopupBtn.addEventListener('click', showPopup);
    </script>

</body>
</html>
