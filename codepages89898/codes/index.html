    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #1a1a2e; /* Dunkles Blau als Fallback-Hintergrundfarbe */
            background-image: url('https://floridevs.github.io/codepages89898/codes/index.png'); /* Dein Hintergrundbild */
            background-size: cover; /* Das Bild deckt den gesamten Hintergrund ab */
            background-position: center; /* Das Bild ist zentriert */
            background-repeat: no-repeat; /* Das Bild wird nicht wiederholt */
            background-attachment: fixed; /* Das Bild bleibt beim Scrollen fixiert */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #e0e0e0; /* Helle Textfarbe für den Dark Mode */
        }

        .container {
            background-color: rgba(26, 26, 46, 0.9); /* Dunkles Blau mit leichter Transparenz */
            padding: 40px 60px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 600px;
            width: 90%;
            border: 1px solid rgba(52, 152, 219, 0.3); /* Leichter blauer Rahmen für den Container */
        }

        h1 {
            color: #3498db; /* Blau für die Überschrift */
            margin-bottom: 30px;
            font-size: 2.5em;
            position: relative;
        }

        h1::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: -10px;
            transform: translateX(-50%);
            width: 60px;
            height: 4px;
            background-color: #206a5d; /* Dunkleres Blau/Grün für die Linie */
            border-radius: 2px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            margin-bottom: 20px;
        }

        a {
            text-decoration: none;
            color: #7fffd4; /* Türkisgrün für Links im Dark Mode */
            font-size: 1.2em;
            padding: 15px 25px;
            border: 2px solid #7fffd4;
            border-radius: 8px;
            display: inline-block;
            transition: all 0.3s ease;
            width: 100%;
            box-sizing: border-box;
        }

        a:hover {
            background-color: #7fffd4;
            color: #1a1a2e; /* Dunkler Hintergrund für den Hover-Effekt */
            box-shadow: 0 5px 15px rgba(127, 255, 212, 0.4);
            transform: translateY(-3px);
        }

        a:active {
            transform: translateY(0);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
