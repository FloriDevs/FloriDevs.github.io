<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UselessMusic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .song-card {
            background-color: #2a2a2a;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .song-card:hover {
            background-color: #3a3a3a;
            transform: translateY(-2px);
        }
        .song-card img {
            width: 100%;
            max-width: 300px;
            border-radius: 8px;
        }
        .song-card h3 {
            margin-top: 10px;
            font-size: 1rem;
            text-align: center;
        }
        .player-controls {
            background-color: #111;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }
        .progress-bar-container {
            flex: 1;
            height: 8px;
            background-color: #444;
            border-radius: 4px;
            position: relative;
            cursor: pointer;
        }
        .progress-bar {
            height: 100%;
            background-color: #1DB954;
            width: 0%;
            border-radius: 4px;
        }
        .volume-slider {
            width: 80px;
        }
        @media (max-width: 768px) {
            .player-controls {
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
            }
            .volume-slider {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="flex flex-col flex-1 overflow-auto pb-32">
        <div class="p-4">
            <input type="search" id="songSearchInput" placeholder="Songs suchen..." class="w-full p-3 text-lg rounded bg-gray-800 text-white mb-4">
            <div id="songList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
        </div>
    </div>

    <div class="player-controls">
        <audio id="audioPlayer"></audio>
        <button id="playPauseButton" class="text-white text-2xl">&#9658;</button>
        <span id="currentTime" class="text-sm">0:00</span>
        <div class="progress-bar-container" id="progressBarContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <span id="duration" class="text-sm">0:00</span>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.7" class="volume-slider">
    </div>

    <script>
        const songListDiv = document.getElementById('songList');
        const audioPlayer = document.getElementById('audioPlayer');
        const playPauseButton = document.getElementById('playPauseButton');
        const progressBar = document.getElementById('progressBar');
        const progressBarContainer = document.getElementById('progressBarContainer');
        const currentTimeSpan = document.getElementById('currentTime');
        const durationSpan = document.getElementById('duration');
        const volumeSlider = document.getElementById('volumeSlider');
        const songSearchInput = document.getElementById('songSearchInput');

        const localSongs = [
           { title: "Hahn !", filename: "Hahn.mp3", cover: "https://cdn.pixabay.com/photo/2018/08/15/11/49/rooster-3607868_1280.jpg" },
           { title: "Google Bells", filename: "Google Bells.mp3", cover: "https://cdn.pixabay.com/photo/2014/09/24/14/29/macbook-459196_1280.jpg" },
            //{ title: "Remix", filename: "song3.mp3", cover: "song3.png" },
        ];

        function renderMusicLibrary(songsToRender = localSongs) {
            songListDiv.innerHTML = '';
            if (songsToRender.length === 0) {
                songListDiv.innerHTML = '<p class="text-center text-gray-400 col-span-full">Keine Songs gefunden.</p>';
                return;
            }
            songsToRender.forEach(song => {
                const songCard = document.createElement('div');
                songCard.className = 'song-card';
                songCard.innerHTML = `
                    <img src="${song.cover}" onerror="this.onerror=null;this.src='https://placehold.co/300x300?text=NO+COVER';">
                    <h3>${song.title}</h3>
                `;
                songCard.addEventListener('click', () => playSong(song.filename));
                songListDiv.appendChild(songCard);
            });
        }

        function playSong(url) {
            audioPlayer.src = url;
            localStorage.setItem('lastPlayed', url);
            audioPlayer.play();
            playPauseButton.innerHTML = '&#10074;&#10074;';
        }

        playPauseButton.addEventListener('click', () => {
            if (audioPlayer.paused) {
                audioPlayer.play();
                playPauseButton.innerHTML = '&#10074;&#10074;';
            } else {
                audioPlayer.pause();
                playPauseButton.innerHTML = '&#9658;';
            }
        });

        audioPlayer.addEventListener('timeupdate', () => {
            if (!isNaN(audioPlayer.duration)) {
                const progress = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                progressBar.style.width = `${progress}%`;
                currentTimeSpan.textContent = formatTime(audioPlayer.currentTime);
            }
        });

        audioPlayer.addEventListener('loadedmetadata', () => {
            if (!isNaN(audioPlayer.duration)) {
                durationSpan.textContent = formatTime(audioPlayer.duration);
            }
        });

        progressBarContainer.addEventListener('click', (e) => {
            const width = progressBarContainer.clientWidth;
            const clickX = e.offsetX;
            const duration = audioPlayer.duration;
            if (!isNaN(duration)) {
                audioPlayer.currentTime = (clickX / width) * duration;
            }
        });

        volumeSlider.addEventListener('input', () => {
            audioPlayer.volume = volumeSlider.value;
        });

        songSearchInput.addEventListener('input', () => {
            const searchTerm = songSearchInput.value.toLowerCase();
            const filteredSongs = localSongs.filter(song =>
                song.title.toLowerCase().includes(searchTerm)
            );
            renderMusicLibrary(filteredSongs);
        });

        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${minutes}:${secs < 10 ? '0' : ''}${secs}`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderMusicLibrary();
            const lastPlayed = localStorage.getItem('lastPlayed');
            if (lastPlayed) {
                audioPlayer.src = lastPlayed;
            }
        });
    </script>
</body>
</html>
