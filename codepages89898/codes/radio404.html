<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Globe Radio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Prevent pull-to-refresh and other gestures on mobile */
            overscroll-behavior: none;
        }
        #globe-container {
            cursor: grab;
            touch-action: none; /* Disable default touch actions like pinch-zoom */
        }
        #globe-container:active {
            cursor: grabbing;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Custom scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1f2937;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }
    </style>
</head>
<body class="bg-gray-900 text-white overflow-hidden h-screen flex flex-col">

    <!-- Top Navigation -->
    <header class="bg-gray-800 shadow-lg z-20">
        <nav class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2 sm:space-x-4">
                 <button id="globe-btn" title="Back to Globe" class="p-2 rounded-full hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                </button>
                 <h1 class="text-lg sm:text-xl font-bold tracking-wider">Globe Radio</h1>
            </div>
            <div class="flex items-center space-x-1 sm:space-x-2">
                <button id="radio-view-btn" title="Radio Player" class="p-2 rounded-full hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z"></path><path d="M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"></path><path d="M12 2v2"></path><path d="M12 22v-2"></path><path d="m17 17 1.4-1.4"></path><path d="m6.4 6.4 1.4 1.4"></path><path d="M22 12h-2"></path><path d="M4 12H2"></path><path d="m17 7-1.4 1.4"></path><path d="m6.4 17.6 1.4-1.4"></path></svg>
                </button>
                <button id="archive-view-btn" title="Internet Archive" class="p-2 rounded-full hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M7 7h10"></path><path d="M7 12h10"></path><path d="M7 17h5"></path></svg>
                </button>
            </div>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow relative">
        <!-- Globe Container -->
        <div id="globe-container" class="absolute inset-0"></div>
        <div id="globe-loader" class="absolute inset-0 flex flex-col justify-center items-center bg-gray-900 bg-opacity-80 z-30">
            <div class="loader"></div>
            <p class="mt-4 text-lg">Loading Globe...</p>
        </div>

        <!-- Radio Player View -->
        <div id="radio-container" class="hidden absolute inset-0 bg-gray-900 p-4 sm:p-6 lg:p-8 flex flex-col">
            <h2 id="radio-title" class="text-2xl sm:text-3xl font-bold mb-4 text-blue-300">Radio Stations</h2>
            <div id="radio-list" class="flex-grow overflow-y-auto custom-scrollbar pr-2">
                <!-- Radio stations will be injected here -->
            </div>
             <div id="radio-loader" class="hidden w-full h-full items-center justify-center">
                <div class="loader"></div>
            </div>
        </div>
        
        <!-- Internet Archive View -->
        <div id="archive-container" class="hidden absolute inset-0 bg-gray-900 p-4 sm:p-6 lg:p-8 flex flex-col">
            <h2 class="text-2xl sm:text-3xl font-bold mb-4 text-green-300">Search the Internet Archive</h2>
            <div class="flex mb-4">
                <input type="text" id="archive-search-input" class="flex-grow bg-gray-800 border border-gray-700 rounded-l-md p-2 focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="Search for songs, artists...">
                <button id="archive-search-btn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-r-md">Search</button>
            </div>
            <div id="archive-results" class="flex-grow overflow-y-auto custom-scrollbar pr-2">
                <!-- Search results will be injected here -->
            </div>
             <div id="archive-loader" class="hidden w-full h-full items-center justify-center">
                <div class="loader"></div>
            </div>
        </div>
        
        <!-- Audio Player -->
        <div id="audio-player-container" class="fixed bottom-0 left-0 right-0 bg-gray-800 bg-opacity-90 backdrop-blur-sm p-3 z-30 transform translate-y-full transition-transform duration-300 ease-in-out">
             <div class="container mx-auto flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                <!-- Info Section -->
                <div class="flex items-center justify-between w-full">
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <img id="station-favicon" src="https://placehold.co/48x48/1f2937/ffffff?text=?" class="w-12 h-12 rounded-md object-cover flex-shrink-0" onerror="this.src='https://placehold.co/48x48/1f2937/ffffff?text=?'">
                        <div class="overflow-hidden">
                            <p id="now-playing-title" class="font-bold truncate">Select a station</p>
                            <p id="now-playing-source" class="text-sm text-gray-400 truncate">Globe Radio</p>
                        </div>
                    </div>
                    <button id="close-player-btn" class="p-2 rounded-full hover:bg-gray-700 flex-shrink-0 sm:hidden">&times;</button>
                </div>
                <!-- Player Controls -->
                <audio id="audio-player" controls class="w-full sm:w-1/2 md:w-2/5"></audio>
                <button id="close-player-btn-desktop" class="p-2 rounded-full hover:bg-gray-700 hidden sm:block">&times;</button>
            </div>
        </div>

        <!-- Custom Alert Box -->
        <div id="alert-box" class="hidden fixed top-20 left-1/2 -translate-x-1/2 w-11/12 max-w-sm bg-red-500 text-white py-2 px-6 rounded-lg shadow-xl z-50 text-center">
            <p class="font-semibold">404: Country Not Available</p>
            <p class="text-sm">This region is currently restricted.</p>
        </div>
    </main>

    <script>
        // --- Configuration ---
        const BLOCKED_COUNTRIES = ['KP', 'RUS', 'IR', 'SY', 'CN']; // ISO 3166-1 alpha-2 codes
        const COUNTRY_LANGUAGE_MAP = {
            'DEU': 'german', 'AT': 'german', 'CH': 'german', 'LI': 'german',
            'USA': 'english', 'GB': 'english', 'CAN': 'english', 'AUS': 'english', 'NZ': 'english', 'IE': 'english', 'ZA': 'english',
            'ES': 'spanish', 'MX': 'spanish', 'AR': 'spanish', 'CO': 'spanish', 'PE': 'spanish', 'VE': 'spanish', 'CL': 'spanish',
            'FR': 'french', 'BE': 'french', 'MC': 'french',
            'PT': 'portuguese', 'BRA': 'portuguese',
            'IT': 'italian',
        };

        // --- DOM Elements ---
        const globeContainer = document.getElementById('globe-container');
        const radioContainer = document.getElementById('radio-container');
        const archiveContainer = document.getElementById('archive-container');
        const globeBtn = document.getElementById('globe-btn');
        const radioViewBtn = document.getElementById('radio-view-btn');
        const archiveViewBtn = document.getElementById('archive-view-btn');
        const alertBox = document.getElementById('alert-box');
        const audioPlayer = document.getElementById('audio-player');
        const playerContainer = document.getElementById('audio-player-container');
        const nowPlayingTitle = document.getElementById('now-playing-title');
        const nowPlayingSource = document.getElementById('now-playing-source');
        const stationFavicon = document.getElementById('station-favicon');
        const closePlayerBtn = document.getElementById('close-player-btn');
        const closePlayerBtnDesktop = document.getElementById('close-player-btn-desktop');
        const globeLoader = document.getElementById('globe-loader');

        // --- State ---
        let currentView = 'globe';
        let scene, camera, renderer, globe, raycaster, mouse;
        let isPointerDown = false;
        let lastPointerX = 0;
        let lastPointerY = 0; // MODIFICATION: Added for vertical rotation
        let countryMeshes = [];

        // --- View Management ---
        function switchView(view) {
            currentView = view;
            globeContainer.classList.toggle('hidden', view !== 'globe');
            radioContainer.classList.toggle('hidden', view !== 'radio');
            archiveContainer.classList.toggle('hidden', view !== 'archive');
            
            radioViewBtn.classList.toggle('bg-blue-600', view === 'radio');
            archiveViewBtn.classList.toggle('bg-green-600', view === 'archive');
            globeBtn.classList.toggle('bg-gray-600', view === 'globe');
        }

        // --- Globe Logic (Three.js) ---
        function initGlobe() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, globeContainer.clientWidth / globeContainer.clientHeight, 0.1, 1000);
            camera.position.z = 2.5;
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(globeContainer.clientWidth, globeContainer.clientHeight);
            globeContainer.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 3, 5);
            scene.add(directionalLight);

            const geometry = new THREE.SphereGeometry(1.5, 64, 64);
            const textureLoader = new THREE.TextureLoader();
            // Using a colorful texture
            const texture = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-day.jpg', loadCountries);
            const material = new THREE.MeshPhongMaterial({ map: texture });
            globe = new THREE.Mesh(geometry, material);
            scene.add(globe);

            const starGeometry = new THREE.BufferGeometry();
            const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.01 });
            const starVertices = [];
            for (let i = 0; i < 10000; i++) {
                const x = (Math.random() - 0.5) * 2000;
                const y = (Math.random() - 0.5) * 2000;
                const z = (Math.random() - 0.5) * 2000;
                starVertices.push(x, y, z);
            }
            starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
            const stars = new THREE.Points(starGeometry, starMaterial);
            scene.add(stars);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            animate();
            addEventListeners();
        }

        async function loadCountries() {
            try {
                const response = await fetch('https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json');
                const data = await response.json();
                
                data.features.forEach(country => {
                    const countryCode = country.id;
                    if (country.geometry.type === 'Polygon') {
                        createShapesFromPolygon(country.geometry.coordinates).forEach(shape => createCountryMesh(shape, countryCode));
                    } else if (country.geometry.type === 'MultiPolygon') {
                        country.geometry.coordinates.forEach(polygon => {
                            createShapesFromPolygon(polygon).forEach(shape => createCountryMesh(shape, countryCode));
                        });
                    }
                });
                globeLoader.classList.add('hidden');
            } catch (error) {
                console.error("Failed to load country data:", error);
                globeLoader.innerHTML = '<p class="text-red-400">Failed to load globe data. Please refresh.</p>';
            }
        }
        
        function createShapesFromPolygon(polygonCoords) {
            const shapes = [];
            const outerRing = polygonCoords[0].map(p => new THREE.Vector2(p[0], p[1]));
            const shape = new THREE.Shape(outerRing);
            for (let i = 1; i < polygonCoords.length; i++) {
                shape.holes.push(new THREE.Path(polygonCoords[i].map(p => new THREE.Vector2(p[0], p[1]))));
            }
            shapes.push(shape);
            return shapes;
        }

        function createCountryMesh(shape, countryCode) {
            const geometry = new THREE.ShapeGeometry(shape);
            const material = new THREE.MeshBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.0, side: THREE.DoubleSide });
            const mesh = new THREE.Mesh(geometry, material);
            
            const positions = geometry.attributes.position;
            for (let i = 0; i < positions.count; i++) {
                const pos = latLonToVector3(positions.getY(i), positions.getX(i), 1.51);
                positions.setXYZ(i, pos.x, pos.y, pos.z);
            }
            positions.needsUpdate = true;
            geometry.computeVertexNormals();
            
            mesh.userData = { countryCode: countryCode, originalOpacity: 0.0 };
            scene.add(mesh);
            countryMeshes.push(mesh);
        }
        
        function latLonToVector3(lat, lon, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            const x = -(radius * Math.sin(phi) * Math.cos(theta));
            const z = (radius * Math.sin(phi) * Math.sin(theta));
            const y = (radius * Math.cos(phi));
            return new THREE.Vector3(x, y, z);
        }

        function animate() {
            requestAnimationFrame(animate);
            if(currentView === 'globe' && !isPointerDown) {
                 const rotationAmount = 0.0005;
                 globe.rotation.y += rotationAmount;
                 countryMeshes.forEach(mesh => mesh.rotation.y += rotationAmount);
            }
            renderer.render(scene, camera);
        }
        
        let hoveredCountry = null;
        function handlePointerMove(event) {
            const currentX = event.touches ? event.touches[0].clientX : event.clientX;
            const currentY = event.touches ? event.touches[0].clientY : event.clientY; // MODIFICATION: Get Y position
            
            if (isPointerDown) {
                const deltaX = currentX - lastPointerX;
                const deltaY = currentY - lastPointerY; // MODIFICATION: Calculate Y delta
                
                // MODIFICATION: Create quaternions for both X and Y axis rotations
                const rotationY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), deltaX * 0.005);
                const rotationX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), deltaY * 0.005);

                // MODIFICATION: Apply both rotations to all globe elements
                [globe, ...countryMeshes].forEach(mesh => {
                    mesh.quaternion.multiplyQuaternions(rotationX, mesh.quaternion);
                    mesh.quaternion.multiplyQuaternions(rotationY, mesh.quaternion);
                });

                lastPointerX = currentX;
                lastPointerY = currentY; // MODIFICATION: Update last Y position
            } else {
                // Hover effect remains the same
                mouse.x = (currentX / window.innerWidth) * 2 - 1;
                mouse.y = - (currentY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(countryMeshes);

                if (hoveredCountry) {
                    hoveredCountry.material.opacity = hoveredCountry.userData.originalOpacity;
                    hoveredCountry = null;
                }

                if (intersects.length > 0) {
                    hoveredCountry = intersects[0].object;
                    hoveredCountry.material.opacity = 0.4;
                }
            }
        }
        
        function handlePointerUp(event) {
            const endX = event.changedTouches ? event.changedTouches[0].clientX : event.clientX;
            const endY = event.changedTouches ? event.changedTouches[0].clientY : event.clientY; // MODIFICATION
            const dx = endX - lastPointerX;
            const dy = endY - lastPointerY; // MODIFICATION
            
            // MODIFICATION: Check for tap vs drag on both axes
            if (isPointerDown && Math.abs(dx) < 5 && Math.abs(dy) < 5) {
                mouse.x = (endX / window.innerWidth) * 2 - 1;
                mouse.y = -(endY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(countryMeshes);

                if (intersects.length > 0) {
                    const countryCode = intersects[0].object.userData.countryCode;
                    handleCountrySelection(countryCode);
                }
            }
            isPointerDown = false;
        }

        function handlePointerDown(event) {
            isPointerDown = true;
            lastPointerX = event.touches ? event.touches[0].clientX : event.clientX;
            lastPointerY = event.touches ? event.touches[0].clientY : event.clientY; // MODIFICATION: Store initial Y position
        }

        // --- Event Listeners ---
        function addEventListeners() {
            // Mouse events
            globeContainer.addEventListener('mousedown', handlePointerDown);
            window.addEventListener('mouseup', handlePointerUp);
            window.addEventListener('mousemove', handlePointerMove);

            // Touch events
            globeContainer.addEventListener('touchstart', handlePointerDown);
            window.addEventListener('touchend', handlePointerUp);
            window.addEventListener('touchmove', handlePointerMove);

            window.addEventListener('resize', () => {
                camera.aspect = globeContainer.clientWidth / globeContainer.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(globeContainer.clientWidth, globeContainer.clientHeight);
            });
            globeContainer.addEventListener('wheel', (event) => {
                camera.position.z += event.deltaY * 0.002;
                camera.position.z = Math.max(1.8, Math.min(10, camera.position.z));
            });

            globeBtn.addEventListener('click', () => switchView('globe'));
            radioViewBtn.addEventListener('click', () => switchView('radio'));
            archiveViewBtn.addEventListener('click', () => switchView('archive'));
            
            const closePlayer = () => {
                playerContainer.classList.add('translate-y-full');
                audioPlayer.pause();
                audioPlayer.src = '';
            };
            closePlayerBtn.addEventListener('click', closePlayer);
            closePlayerBtnDesktop.addEventListener('click', closePlayer);
            
            const archiveSearchInput = document.getElementById('archive-search-input');
            document.getElementById('archive-search-btn').addEventListener('click', searchArchive);
            archiveSearchInput.addEventListener('keyup', (e) => {
                if(e.key === 'Enter') searchArchive();
            });
        }

        // --- Country & Radio Logic ---
        function handleCountrySelection(countryCode) {
            if (BLOCKED_COUNTRIES.includes(countryCode)) {
                showAlert('404: Country Not Available', 'This region is currently restricted.');
                return;
            }
            
            const language = Object.keys(COUNTRY_LANGUAGE_MAP).find(key => key === countryCode) ? COUNTRY_LANGUAGE_MAP[countryCode] : null;
            if (language) {
                fetchRadioStationsByLanguage(language);
                switchView('radio');
            } else {
                 showAlert('No Radio Data', `Could not find radio information for country code: ${countryCode}`);
            }
        }

        async function fetchRadioStationsByLanguage(language) {
            const radioList = document.getElementById('radio-list');
            const radioLoader = document.getElementById('radio-loader');
            radioList.innerHTML = '';
            radioLoader.classList.remove('hidden');
            document.getElementById('radio-title').textContent = `Radio Stations (${language.charAt(0).toUpperCase() + language.slice(1)})`;

            try {
                // MODIFICATION: Changed de1.api.radio-browser.info to a more reliable, randomly resolving domain.
                const response = await fetch(`https://all.api.radio-browser.info/json/stations/bylanguageexact/${language}?limit=200&order=clickcount&reverse=true`);
                const data = await response.json();

                if (data && data.length > 0) {
                    radioList.innerHTML = data.map(station => `
                        <div class="flex items-center p-3 rounded-lg hover:bg-gray-800 cursor-pointer station-item" data-url="${station.url_resolved}" data-name="${station.name}" data-favicon="${station.favicon}" data-country="${station.country}">
                            <img src="${station.favicon}" class="w-12 h-12 rounded-md mr-4 object-cover bg-gray-700" onerror="this.src='https://placehold.co/48x48/1f2937/ffffff?text=${station.name.charAt(0)}'">
                            <div class="flex-grow overflow-hidden">
                                <p class="font-semibold truncate">${station.name}</p>
                                <p class="text-sm text-gray-400 truncate">${station.country} - ${station.state || ''}</p>
                            </div>
                            <span class="text-xs text-gray-500 flex-shrink-0 ml-2">${station.codec} / ${station.bitrate}kbps</span>
                        </div>
                    `).join('');
                    
                    document.querySelectorAll('.station-item').forEach(item => {
                        item.addEventListener('click', () => playRadio(item.dataset));
                    });
                } else {
                    radioList.innerHTML = `<p class="text-gray-400">No stations found for ${language}.</p>`;
                }
            } catch (error) {
                console.error("Radio fetch error:", error); // Added console log for debugging
                radioList.innerHTML = `<p class="text-red-400">Failed to load radio stations. Please check your connection.</p>`;
            } finally {
                radioLoader.classList.add('hidden');
            }
        }
        
        function playRadio(stationData) {
            nowPlayingTitle.textContent = stationData.name;
            nowPlayingSource.textContent = `Radio: ${stationData.country}`;
            stationFavicon.src = stationData.favicon;
            audioPlayer.src = stationData.url;
            audioPlayer.play().catch(e => console.error("Audio playback failed:", e));
            playerContainer.classList.remove('translate-y-full');
        }
        
        // --- Internet Archive Logic ---
        async function searchArchive() {
            const query = document.getElementById('archive-search-input').value;
            if (!query.trim()) return;

            const resultsContainer = document.getElementById('archive-results');
            const archiveLoader = document.getElementById('archive-loader');
            resultsContainer.innerHTML = '';
            archiveLoader.classList.remove('hidden');

            const searchUrl = `https://archive.org/advancedsearch.php?q=mediatype:(audio) AND title:(${query})&fl[]=identifier,title,creator,year&rows=50&page=1&output=json`;

            try {
                const response = await fetch(searchUrl);
                const data = await response.json();
                const docs = data.response.docs;

                if (docs.length > 0) {
                    resultsContainer.innerHTML = docs.map(doc => `
                        <div class="flex items-center p-3 rounded-lg hover:bg-gray-800 cursor-pointer archive-item" data-id="${doc.identifier}" data-title="${doc.title}" data-creator="${doc.creator || 'Unknown Artist'}">
                            <div class="w-12 h-12 rounded-md mr-4 bg-gray-700 flex items-center justify-center flex-shrink-0">
                               <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                            </div>
                            <div class="flex-grow overflow-hidden">
                                <p class="font-semibold truncate">${doc.title}</p>
                                <p class="text-sm text-gray-400 truncate">${doc.creator || 'Unknown Artist'} ${doc.year ? `(${doc.year})` : ''}</p>
                            </div>
                        </div>
                    `).join('');

                    document.querySelectorAll('.archive-item').forEach(item => {
                        item.addEventListener('click', () => playArchiveItem(item.dataset));
                    });
                } else {
                    resultsContainer.innerHTML = `<p class="text-gray-400">No audio files found for "${query}".</p>`;
                }
            } catch (error) {
                resultsContainer.innerHTML = `<p class="text-red-400">Failed to perform search.</p>`;
            } finally {
                archiveLoader.classList.add('hidden');
            }
        }
        
        async function playArchiveItem(itemData) {
            const metaUrl = `https://archive.org/metadata/${itemData.id}`;
            try {
                const response = await fetch(metaUrl);
                const data = await response.json();
                const audioFile = data.files.find(f => f.format.includes('VBR MP3') || f.format.includes('MP3'));
                
                if (audioFile) {
                    const audioUrl = `https://archive.org/download/${itemData.id}/${audioFile.name}`;
                    nowPlayingTitle.textContent = itemData.title;
                    nowPlayingSource.textContent = `Archive: ${itemData.creator}`;
                    stationFavicon.src = `https://archive.org/services/get-item-image.php?identifier=${itemData.id}`;
                    audioPlayer.src = audioUrl;
                    audioPlayer.play().catch(e => console.error("Audio playback failed:", e));
                    playerContainer.classList.remove('translate-y-full');
                } else {
                    showAlert('No Playable File', 'Could not find a playable audio file for this item.');
                }
            } catch (error) {
                showAlert('Error', 'Could not load the selected audio.');
            }
        }

        // --- Utility ---
        function showAlert(title, message) {
            alertBox.querySelector('p:first-child').textContent = title;
            alertBox.querySelector('p:last-child').textContent = message;
            alertBox.classList.remove('hidden');
            setTimeout(() => {
                alertBox.classList.add('hidden');
            }, 4000);
        }

        // --- App Initialization ---
        initGlobe();
    </script>
</body>
</html>
