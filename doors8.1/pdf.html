<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer/Editor with Wikipedia</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- pdf-lib for creating and editing PDF documents -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <!-- pdf.js for rendering PDF documents in the browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Custom styles to complement Tailwind CSS */
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        /* Custom scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        /* Style for the resizer handle */
        .resizer {
            cursor: col-resize;
            background-color: #e2e8f0;
            width: 6px;
            transition: background-color 0.2s;
        }
        .resizer:hover {
            background-color: #3b82f6;
        }
        /* Class to indicate an active tool button */
        .tool-active {
            background-color: #16a34a !important; /* Green-600 */
            color: white !important;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.2);
        }
        /* Visual feedback for drag-and-drop */
        .drag-over-active {
            outline: 2px dashed #3b82f6; /* blue-500 */
            outline-offset: -10px;
            background-color: #eff6ff; /* blue-50 */
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800">

    <!-- Main Header -->
    <header class="bg-white shadow-md z-20">
        <div class="container mx-auto px-4 py-2 flex justify-between items-center">
            <h1 class="text-xl font-bold text-slate-700 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                PDF Editor & Researcher
            </h1>
            <div class="flex items-center gap-2">
                <button class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg shadow transition" onclick="createNewPDF()">New PDF</button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex h-[calc(100vh-56px)]" id="main-container">
        
        <!-- Left Panel: Wikipedia -->
        <div id="left-panel" class="w-1/2 flex flex-col bg-white border-r border-slate-200">
            <div class="p-3 border-b border-slate-200 bg-slate-50">
                <h2 class="font-bold text-slate-600">Wikipedia Research</h2>
                <div class="flex gap-2 mt-2">
                    <input type="text" id="wikipediaSearch" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Search Wikipedia...">
                    <button class="bg-slate-700 hover:bg-slate-800 text-white font-semibold py-2 px-4 rounded-lg shadow transition" onclick="searchWikipedia()">Search</button>
                </div>
            </div>
            <div class="flex-grow relative">
                <iframe id="wikipediaIframe" src="https://en.wikipedia.org/wiki/Main_Page" class="w-full h-full border-0"></iframe>
            </div>
        </div>

        <!-- Resizer Handle -->
        <div id="resizer" class="resizer"></div>

        <!-- Right Panel: PDF Viewer/Editor -->
        <div id="right-panel" class="w-1/2 flex flex-col">
            <div class="p-2 border-b border-slate-200 bg-slate-50 shadow-sm flex flex-wrap items-center gap-4">
                <!-- File Controls -->
                <div class="flex items-center gap-2">
                    <input type="file" id="pdfInput" class="hidden" accept=".pdf">
                    <button class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg shadow transition" onclick="document.getElementById('pdfInput').click()">Open PDF</button>
                    <button id="downloadBtn" class="bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-4 rounded-lg shadow transition hidden" onclick="downloadPDF()">Save PDF</button>
                </div>
                <!-- Editing Tools -->
                <div class="flex items-center gap-2 border-l pl-4">
                    <button id="textBtn" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold py-2 px-4 rounded-lg transition" onclick="toggleTextMode()">Add Text</button>
                    <input type="text" id="textInput" class="px-2 py-1 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 hidden" placeholder="Your text...">
                    <input type="color" id="colorPicker" class="w-10 h-10 p-1 border border-slate-300 rounded-md cursor-pointer" value="#000000">
                </div>
                 <!-- Image Tools -->
                <div class="flex items-center gap-2 border-l pl-4">
                    <input type="file" id="imageInput" class="hidden" accept="image/png, image/jpeg">
                    <button class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold py-2 px-4 rounded-lg transition" onclick="document.getElementById('imageInput').click()">Add Image</button>
                    <button id="imageBtn" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold py-2 px-4 rounded-lg transition hidden" onclick="toggleImageMode()">Place Image</button>
                </div>
            </div>
            
            <!-- PDF Viewer -->
            <div id="pdfViewer" class="flex-grow bg-slate-200 overflow-auto p-4 relative transition-all duration-200">
                <div id="canvas-container" class="flex justify-center">
                    <canvas id="pdfCanvas" class="shadow-lg"></canvas>
                </div>
                <!-- Page Navigation -->
                <div id="pageControls" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-4 py-2 rounded-full shadow-lg flex items-center gap-4">
                    <button id="prevBtn" class="hover:text-blue-400 disabled:text-slate-500 disabled:cursor-not-allowed" onclick="prevPage()">Prev</button>
                    <span id="pageInfo">Page 1 / 1</span>
                    <button id="nextBtn" class="hover:text-blue-400 disabled:text-slate-500 disabled:cursor-not-allowed" onclick="nextPage()">Next</button>
                </div>
            </div>
        </div>

    </main>

    <script>
        // Setup for PDF.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js`;

        // Global state variables
        let pdfDoc = null; // pdf-lib document object for editing
        let pdfJSDoc = null; // pdf.js document object for rendering
        let currentPageNum = 1;
        let zoom = 1.5;
        let isTextMode = false;
        let isImageMode = false;
        let selectedImageData = null; // Stores base64 data for the selected image
        let annotations = []; // Array to store annotations for all pages

        // DOM element references
        const pdfCanvas = document.getElementById('pdfCanvas');
        const canvasCtx = pdfCanvas.getContext('2d');
        const pdfViewer = document.getElementById('pdfViewer');

        // --- WIKIPEDIA FUNCTIONS ---
        const searchWikipedia = () => {
            const query = document.getElementById('wikipediaSearch').value.trim();
            if (query) {
                document.getElementById('wikipediaIframe').src = `https://en.wikipedia.org/wiki/${encodeURIComponent(query.replace(/ /g, '_'))}`;
            }
        };
        
        document.getElementById('wikipediaSearch').addEventListener('keyup', (e) => {
            if (e.key === 'Enter') searchWikipedia();
        });

        // --- PDF RENDERING (PDF.js) ---
        const renderPage = async (num) => {
            if (!pdfJSDoc) return;
            currentPageNum = num;
            
            const page = await pdfJSDoc.getPage(num);
            const viewport = page.getViewport({ scale: zoom });
            
            pdfCanvas.height = viewport.height;
            pdfCanvas.width = viewport.width;

            const renderContext = {
                canvasContext: canvasCtx,
                viewport: viewport,
            };
            
            await page.render(renderContext).promise;
            drawAnnotations();
            updatePageInfo();
        };

        const drawAnnotations = () => {
            // Filter annotations for the current page
            const pageAnnotations = annotations.filter(a => a.page === currentPageNum);
            
            pageAnnotations.forEach(annotation => {
                if (annotation.type === 'text') {
                    canvasCtx.fillStyle = annotation.color;
                    canvasCtx.font = `${annotation.size}px Inter`;
                    canvasCtx.textAlign = 'left';
                    canvasCtx.textBaseline = 'top';
                    canvasCtx.fillText(annotation.text, annotation.x, annotation.y);
                } else if (annotation.type === 'image') {
                    const img = new Image();
                    img.onload = () => {
                        canvasCtx.drawImage(img, annotation.x, annotation.y, annotation.width, annotation.height);
                    };
                    img.src = annotation.imageData;
                }
            });
        };

        // --- PDF LOADING & CREATION ---
        const loadPDF = async (file) => {
            try {
                const arrayBuffer = await file.arrayBuffer();
                
                // Load with pdf-lib for editing capabilities
                pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);
                
                // Load with pdf.js for rendering
                pdfJSDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                
                annotations = []; // Reset annotations on new file load
                await renderPage(1);
                
                document.getElementById('downloadBtn').classList.remove('hidden');
                document.getElementById('pageControls').classList.remove('hidden');
            } catch (error) {
                console.error("Error loading PDF:", error);
                alert("Failed to load PDF. Please check the console for details.");
            }
        };

        const createNewPDF = async () => {
            pdfDoc = await PDFLib.PDFDocument.create();
            pdfDoc.addPage([595, 842]); // A4 size
            
            const pdfBytes = await pdfDoc.save();
            pdfJSDoc = await pdfjsLib.getDocument({ data: pdfBytes }).promise;
            
            annotations = [];
            await renderPage(1);

            document.getElementById('downloadBtn').classList.remove('hidden');
            document.getElementById('pageControls').classList.remove('hidden');
        };

        // --- PDF SAVING (pdf-lib) ---
        const downloadPDF = async () => {
            if (!pdfDoc) return;
            
            try {
                const pages = pdfDoc.getPages();
                const font = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
                
                // Embed all unique images first to avoid redundancy
                const embeddedImages = new Map();
                for (const annotation of annotations) {
                    if (annotation.type === 'image' && !embeddedImages.has(annotation.imageData)) {
                        const imageBytes = Uint8Array.from(atob(annotation.imageData.split(',')[1]), c => c.charCodeAt(0));
                        const embeddedImage = await (annotation.imageType === 'image/png' ? pdfDoc.embedPng(imageBytes) : pdfDoc.embedJpg(imageBytes));
                        embeddedImages.set(annotation.imageData, embeddedImage);
                    }
                }

                for (let i = 0; i < pages.length; i++) {
                    const page = pages[i];
                    const { width, height } = page.getSize();
                    const pageAnnotations = annotations.filter(a => a.page === i + 1);

                    for (const annotation of pageAnnotations) {
                        if (annotation.type === 'text') {
                            const { r, g, b } = PDFLib.rgb(
                                parseInt(annotation.color.slice(1, 3), 16) / 255,
                                parseInt(annotation.color.slice(3, 5), 16) / 255,
                                parseInt(annotation.color.slice(5, 7), 16) / 255
                            );
                            page.drawText(annotation.text, {
                                x: annotation.x,
                                y: height - annotation.y - annotation.size, // Adjust y-coordinate for pdf-lib origin
                                font: font,
                                size: annotation.size,
                                color: r === undefined ? PDFLib.rgb(0,0,0) : PDFLib.rgb(r,g,b), // fallback for invalid color
                            });
                        } else if (annotation.type === 'image') {
                            const embeddedImage = embeddedImages.get(annotation.imageData);
                            page.drawImage(embeddedImage, {
                                x: annotation.x,
                                y: height - annotation.y - annotation.height, // Adjust y-coordinate
                                width: annotation.width,
                                height: annotation.height,
                            });
                        }
                    }
                }

                const pdfBytes = await pdfDoc.save();
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'edited-document.pdf';
                link.click();
                URL.revokeObjectURL(link.href);

            } catch (error) {
                console.error("Error saving PDF:", error);
                alert("Failed to save PDF. See console for details.");
            }
        };

        // --- UI & EVENT HANDLERS ---
        const updatePageInfo = () => {
            if (!pdfJSDoc) return;
            document.getElementById('pageInfo').textContent = `Page ${currentPageNum} / ${pdfJSDoc.numPages}`;
            document.getElementById('prevBtn').disabled = currentPageNum <= 1;
            document.getElementById('nextBtn').disabled = currentPageNum >= pdfJSDoc.numPages;
        };

        const prevPage = () => {
            if (currentPageNum > 1) renderPage(currentPageNum - 1);
        };

        const nextPage = () => {
            if (pdfJSDoc && currentPageNum < pdfJSDoc.numPages) renderPage(currentPageNum + 1);
        };

        const resetTools = () => {
            isTextMode = false;
            isImageMode = false;
            document.getElementById('textBtn').classList.remove('tool-active');
            document.getElementById('imageBtn').classList.remove('tool-active');
            document.getElementById('textInput').classList.add('hidden');
            pdfCanvas.style.cursor = 'default';
        };

        const toggleTextMode = () => {
            const wasActive = isTextMode;
            resetTools();
            if (!wasActive) {
                isTextMode = true;
                document.getElementById('textBtn').classList.add('tool-active');
                document.getElementById('textInput').classList.remove('hidden');
                pdfCanvas.style.cursor = 'text';
            }
        };

        const toggleImageMode = () => {
            if (!selectedImageData) return;
            const wasActive = isImageMode;
            resetTools();
            if (!wasActive) {
                isImageMode = true;
                document.getElementById('imageBtn').classList.add('tool-active');
                pdfCanvas.style.cursor = 'crosshair';
            }
        };
        
        // --- IMAGE HANDLING (File Input & Drag-and-Drop) ---
        const processImageFile = (file) => {
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    selectedImageData = {
                        dataUrl: event.target.result,
                        type: file.type
                    };
                    document.getElementById('imageBtn').classList.remove('hidden');
                    resetTools();
                    alert("Image loaded! Click 'Place Image' to add it to the PDF.");
                };
                reader.readAsDataURL(file);
            } else {
                alert("Please select or drop a valid image file (PNG or JPG).");
            }
        };

        // File input listener
        document.getElementById('imageInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            processImageFile(file);
        });
        
        // Drag and Drop listeners for images
        pdfViewer.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.stopPropagation();
            pdfViewer.classList.add('drag-over-active');
        });

        pdfViewer.addEventListener('dragleave', (e) => {
            e.preventDefault();
            e.stopPropagation();
            pdfViewer.classList.remove('drag-over-active');
        });

        pdfViewer.addEventListener('drop', (e) => {
            e.preventDefault();
            e.stopPropagation();
            pdfViewer.classList.remove('drag-over-active');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                processImageFile(files[0]);
            }
        });

        document.getElementById('pdfInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file && file.type === 'application/pdf') {
                loadPDF(file);
            }
        });

        // Canvas click listener for adding annotations
        pdfCanvas.addEventListener('click', (e) => {
            if (!isTextMode && !isImageMode) return;

            const rect = pdfCanvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (isTextMode) {
                const text = document.getElementById('textInput').value;
                const color = document.getElementById('colorPicker').value;
                if (text.trim()) {
                    annotations.push({ page: currentPageNum, type: 'text', x, y, text, color, size: 16 });
                    renderPage(currentPageNum); // Redraw to show new annotation
                }
            } else if (isImageMode) {
                const img = new Image();
                img.onload = () => {
                    const aspectRatio = img.width / img.height;
                    const width = 100; // Default width
                    const height = width / aspectRatio;
                    annotations.push({ 
                        page: currentPageNum, 
                        type: 'image', 
                        x, y, 
                        imageData: selectedImageData.dataUrl,
                        imageType: selectedImageData.type,
                        width, height 
                    });
                    renderPage(currentPageNum); // Redraw
                    toggleImageMode(); // Exit image mode after placing
                };
                img.src = selectedImageData.dataUrl;
            }
        });
        
        // Panel resizing logic
        const resizer = document.getElementById('resizer');
        const leftPanel = document.getElementById('left-panel');
        const rightPanel = document.getElementById('right-panel');

        let isResizing = false;
        resizer.addEventListener('mousedown', (e) => {
            isResizing = true;
            document.body.style.cursor = 'col-resize';
            document.addEventListener('mousemove', handleResize);
            document.addEventListener('mouseup', stopResize);
        });

        const handleResize = (e) => {
            if (!isResizing) return;
            const container = document.getElementById('main-container');
            const totalWidth = container.offsetWidth;
            const leftWidth = e.clientX - container.offsetLeft;
            const newLeftPanelWidth = (leftWidth / totalWidth) * 100;
            
            if (newLeftPanelWidth > 10 && newLeftPanelWidth < 90) { // Set min/max widths
                leftPanel.style.width = `${newLeftPanelWidth}%`;
                rightPanel.style.width = `${100 - newLeftPanelWidth}%`;
            }
        };

        const stopResize = () => {
            isResizing = false;
            document.body.style.cursor = 'default';
            document.removeEventListener('mousemove', handleResize);
            document.removeEventListener('mouseup', stopResize);
        };
        
        // Initial call to set up a blank canvas
        createNewPDF();

    </script>
</body>
</html>
